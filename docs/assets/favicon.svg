<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d1117"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <g filter="url(#blur)">
    <!-- Keyboard Base Shape -->
    <rect x="12" y="16" width="40" height="32" rx="8" fill="#161b22" stroke="url(#glow)" stroke-width="2"/>
    <!-- Keys Grid -->
    <rect x="17" y="21" width="6" height="6" rx="2" fill="#21262d" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="26" y="21" width="6" height="6" rx="2" fill="#21262d" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="35" y="21" width="6" height="6" rx="2" fill="#10b981" fill-opacity="0.8"/>
    <rect x="44" y="21" width="3" height="6" rx="1.5" fill="#38bdf8" fill-opacity="0.8"/>

    <rect x="17" y="30" width="8" height="6" rx="2" fill="#21262d" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="28" y="30" width="8" height="6" rx="2" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="39" y="30" width="8" height="6" rx="2" fill="#21262d" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Spacebar with typing cadence spark -->
    <rect x="20" y="39" width="24" height="4" rx="2" fill="url(#glow)"/>
    <circle cx="32" cy="41" r="2" fill="#ffffff"/>
  </g>
</svg>
